[graph]
targets = []
all-features = true

[advisories]
version = 2
ignore = [
    # paste is unmaintained but is a transitive dep from ratatui; no action available
    "RUSTSEC-2024-0436",
    # instant is unmaintained; transitive dep from notify via filetime/globset
    "RUSTSEC-2024-0384",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# The project itself uses CC-BY-NC-SA-4.0 which is not in the allow list
[[licenses.exceptions]]
allow = ["CC-BY-NC-SA-4.0"]
crate = "claude-stats"

# LGPL is only one option in an OR expression; the crate can be used under MIT/Apache
[[licenses.exceptions]]
allow = ["LGPL-2.1-or-later"]
crate = "option-ext"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
