[package]
name = "claude-stats"
version = "1.0.0"
edition = "2021"
description = "A TUI dashboard for Claude Code usage limits"
license = "CC-BY-NC-SA-4.0"
authors = ["i-am-logger"]
repository = "https://github.com/i-am-logger/claude-stats"
keywords = ["tui", "claude", "terminal", "statistics"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
ratatui = "0.29"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
notify = "7.0"
humantime = "2.3.0"
thiserror = "2.0.18"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_extern_crates = "deny"
macro_use_extern_crate = "deny"
single_use_lifetimes = "deny"
redundant_lifetimes = "deny"
redundant_imports = "deny"
explicit_outlives_requirements = "deny"
non_ascii_idents = "deny"
unit_bindings = "deny"
meta_variable_misuse = "deny"
variant_size_differences = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
ambiguous_negative_literals = "deny"
closure_returning_async_block = "deny"
unused_crate_dependencies = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# restriction lints — opt-in for code discipline
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
rest_pat_in_fully_bound_structs = "deny"
todo = "deny"
unimplemented = "deny"
unnecessary_self_imports = "deny"

# nursery lints — catch likely bugs
nursery = { level = "deny", priority = -1 }

# pedantic overrides — suppress where they hurt readability
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"

# nursery overrides — too noisy or false-positive heavy
option_if_let_else = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
